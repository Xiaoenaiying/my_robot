controller_manager:
  ros__parameters:
    update_rate: 100
    use_sim_time: true

    mecanum_drive_controller: 
      type: mecanum_drive_controller/MecanumDriveController
    
    joint_state:
      type: joint_state_broadcaster/JointStateBroadcaster

mecanum_drive_controller:
  ros__parameters:
    # 四个轮名 —— 必填，按【物理位置】对号，不是按 0/1/2/3 顺序随便填
    front_left_wheel_command_joint_name:  "base_left_front_wheel_joint"
    front_right_wheel_command_joint_name: "base_right_front_wheel_joint"
    rear_right_wheel_command_joint_name:  "base_right_rear_wheel_joint"
    rear_left_wheel_command_joint_name:   "base_left_rear_wheel_joint"

    # teleop 发 Twist 就用 false；true 时控制器只收 TwistStamped
    use_stamped_vel: false

    kinematics:
      base_frame_offset: { x: 0.0, y: 0.0, theta: 0.0 }
      wheels_radius: 0.0586                              # ← 填 urdf 里 wheel_reduis 的同一个数
      sum_of_robot_center_projection_on_X_Y_axis: 0.36  # ← 填 urdf 里 lx+ly 的和

    base_frame_id: "base_link"
    odom_frame_id: "odom"
    enable_odom_tf: true
    pose_covariance_diagonal:  [0.001, 0.001, 1000000.0, 1000000.0, 1000000.0, 0.001]
    twist_covariance_diagonal: [0.001, 0.001, 1000000.0, 1000000.0, 1000000.0, 0.001]
